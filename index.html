<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#222222" />
    <style>
      :root {
        background: #222222;
        color-scheme: dark;
      }
      .app-startup {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
      }
      .app-startup-spinner {
        width: 38px;
        height: 38px;
        border: 3px solid #ffffff25;
        border-top-color: #ffabb6;
        border-right-color: #ffabb680;
        border-radius: 50%;
        animation: app-startup-spin 0.9s linear infinite;
      }
      @keyframes app-startup-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-startup-spinner {
          animation: none;
        }
      }
    </style>
    <noscript>
      <style>
        .app-startup {
          display: none;
        }
      </style>
    </noscript>
    <meta
      name="description"
      content="YummyWatch — твоё аниме под рукой. Быстрый мобильный клиент YummyAnime: каталог, озвучки, расписание и личная коллекция."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="YummyWatch" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icons/icon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="preconnect" href="https://api.yani.tv" />
    <link rel="preconnect" href="https://static.yani.tv" />
    <title>YummyWatch — аниме под рукой</title>
  </head>
  <body>
    <div class="app-startup" id="app-startup" role="status" aria-label="Запуск YummyWatch">
      <span class="app-startup-spinner" aria-hidden="true"></span>
    </div>
    <div id="app"></div>
    <noscript
      >Для YummyWatch нужен JavaScript.
      <a href="https://ru.yummyani.me/">Открыть YummyAnime</a></noscript
    >
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
