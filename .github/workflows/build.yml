name: Build installers
on:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
      mobile:
        type: boolean
        default: true
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always
  RELEASE_BUILD: ${{ inputs.release }}
  VITE_YUMMY_APPLICATION_TOKEN: ${{ secrets.YUMMY_APPLICATION_TOKEN }}
  VITE_DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
jobs:
  windows-libmpv:
    name: Build Windows libmpv
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: libmpv-cache
        with:
          path: src-tauri/native-libs/windows
          key: windows-libmpv-ubuntu24-x64-${{ hashFiles('packaging/windows/build-libmpv.sh') }}
      - name: Install Windows cross-compiler and build tools
        if: steps.libmpv-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix cmake meson ninja-build nasm gperf python3-jinja2
      - name: Build compact Windows libmpv
        if: steps.libmpv-cache.outputs.cache-hit != 'true'
        run: bash packaging/windows/build-libmpv.sh src-tauri/native-libs/windows
      - name: Verify the Windows bundle
        working-directory: src-tauri/native-libs/windows
        run: sha256sum --check SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows-libmpv
          path: src-tauri/native-libs/windows/*
          if-no-files-found: error
          retention-days: 1

  desktop:
    name: ${{ matrix.platform }}
    needs: windows-libmpv
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - platform: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - platform: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - platform: macos-intel
            os: macos-15
            target: x86_64-apple-darwin
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: macOS architectures
        if: runner.os == 'macOS'
        run: rustup target add ${{ matrix.target }}
      - uses: actions/setup-python@v5
        if: runner.os == 'macOS'
        with:
          python-version: '3.13'
      - name: macOS libmpv build tools
        if: runner.os == 'macOS'
        run: python3 -m pip install meson==1.12.1 ninja==1.13.2 Jinja2==3.1.6
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libmpv-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf rpm libgstreamer1.0-dev gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # Reuse both architecture caches from the initial universal build.
          key: ${{ runner.os == 'macOS' && 'macos-universal' || matrix.platform }}
      - run: npm ci
      - uses: actions/download-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: windows-libmpv
          path: src-tauri/native-libs/windows
      - name: Prepare Windows libmpv
        if: runner.os == 'Windows'
        run: node scripts/prepare-windows-libmpv.mjs
      - name: Require application token for release
        if: inputs.release
        run: node scripts/check-application-token.mjs
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build installers
        run: node scripts/build-desktop.mjs ${{ matrix.target }} ${{ matrix.bundles }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Verify embedded application token
        if: inputs.release
        run: node scripts/check-application-token.mjs dist
      - name: Verify packaged libmpv on macOS
        if: (matrix.platform == 'macos-arm64' && runner.arch == 'ARM64') || (matrix.platform == 'macos-intel' && runner.arch == 'X64')
        run: src-tauri/target/${{ matrix.target }}/release/bundle/macos/YummyWatch.app/Contents/MacOS/yummywatch --check-libmpv
      - name: Verify AppImage includes libmpv
        if: runner.os == 'Linux'
        shell: bash
        run: |
          image=$(find "$PWD/src-tauri/target/${{ matrix.target }}/release/bundle/appimage" -name '*.AppImage' -print -quit)
          test -n "$image"
          cd "$RUNNER_TEMP"
          "$image" --appimage-extract >/dev/null
          test -n "$(find squashfs-root -name 'libmpv.so.2*' -type f -print -quit)"
      - name: Build and verify Arch Linux package
        if: runner.os == 'Linux'
        run: node scripts/package-arch.mjs src-tauri/target/${{ matrix.target }}/release/bundle
      - run: node scripts/collect-release.mjs ${{ matrix.platform }} src-tauri/target/${{ matrix.target }}/release/bundle
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  android:
    if: inputs.mobile
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Android NDK
        shell: bash
        run: |
          sdkmanager "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android
      - run: npm ci
      - name: Require application token for release
        if: inputs.release
        run: node scripts/check-application-token.mjs
      - run: npm run init:android
      - name: Restore Android signing key
        if: inputs.release
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          : "${ANDROID_KEY_BASE64:?Set ANDROID_KEY_BASE64 in repository secrets}"
          : "${ANDROID_KEY_ALIAS:?Set ANDROID_KEY_ALIAS in repository secrets}"
          : "${ANDROID_STORE_PASSWORD:?Set ANDROID_STORE_PASSWORD in repository secrets}"
          : "${ANDROID_KEY_PASSWORD:?Set ANDROID_KEY_PASSWORD in repository secrets}"
          printf '%s' "$ANDROID_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/yummywatch.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/yummywatch.jks" >> "$GITHUB_ENV"
      - name: Android debug APK
        if: ${{ !inputs.release }}
        run: npm run build:android -- --ci --debug --target aarch64 --apk -- --locked
      - name: Android release APK and AAB
        if: inputs.release
        run: npm run build:android -- --ci --target aarch64 armv7 x86_64 --apk --aab -- --locked
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Verify embedded application token
        if: inputs.release
        run: node scripts/check-application-token.mjs dist
      - run: node scripts/collect-release.mjs android src-tauri/gen/android/app/build/outputs
      - uses: actions/upload-artifact@v4
        with:
          name: installers-android
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
      - name: Remove upload key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/yummywatch.jks"

  ios:
    if: inputs.mobile
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # A real team is required only for device release signing.
      APPLE_DEVELOPMENT_TEAM: ${{ vars.APPLE_DEVELOPMENT_TEAM || '0000000000' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ios
      - run: npm ci
      - name: Require application token for release
        if: inputs.release
        run: node scripts/check-application-token.mjs
      - name: iOS build tools
        run: |
          command -v xcodegen || brew install xcodegen
          command -v pod || brew install cocoapods
      - run: npm run init:ios
      - name: Build simulator app
        if: ${{ !inputs.release }}
        run: npm run build:ios -- --ci --target aarch64-sim --no-sign -- --locked
      - name: Archive simulator app
        if: ${{ !inputs.release }}
        shell: bash
        run: |
          APP=$(find src-tauri/gen/apple/build -type d -name 'YummyWatch.app' -print -quit)
          test -n "$APP"
          mkdir -p ios-output
          ditto -c -k --keepParent "$APP" ios-output/YummyWatch-simulator.zip
      - name: Build signed iOS IPA
        if: inputs.release
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
        shell: bash
        run: |
          test "$APPLE_DEVELOPMENT_TEAM" != 0000000000
          : "${IOS_CERTIFICATE:?Set IOS_CERTIFICATE in repository secrets}"
          : "${IOS_CERTIFICATE_PASSWORD:?Set IOS_CERTIFICATE_PASSWORD in repository secrets}"
          : "${IOS_MOBILE_PROVISION:?Set IOS_MOBILE_PROVISION in repository secrets}"
          npm run build:ios -- --ci --target aarch64 --export-method app-store-connect --build-number "$GITHUB_RUN_NUMBER" -- --locked
      - name: Collect simulator
        if: ${{ !inputs.release }}
        run: node scripts/collect-release.mjs ios-simulator ios-output
      - name: Verify embedded application token
        if: inputs.release
        run: node scripts/check-application-token.mjs dist
      - name: Collect signed IPA
        if: inputs.release
        run: node scripts/collect-release.mjs ios src-tauri/gen/apple/build
      - uses: actions/upload-artifact@v4
        with:
          name: installers-ios
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
