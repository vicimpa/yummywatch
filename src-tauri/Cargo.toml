[package]
name = "yummywatch"
version = "0.0.10"
description = "YummyWatch anime application"
edition = "2021"
rust-version = "1.90"

[lib]
name = "yummywatch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
serde_json = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "macros", "net", "io-util", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "gzip", "socks"] }
regex = "1"
url = "2"
rand = "0.9"
base64 = "0.22"
quick-xml = "0.42"

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
sha2 = "0.10"
time = { version = "0.3", features = ["parsing"] }

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux", target_os = "android"))'.dependencies]
futures-util = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
libloading = "0.7"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["NSNotification", "NSString", "NSOperation", "NSProcessInfo", "block2"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSWindow", "NSButton", "NSView", "NSControl", "NSResponder", "NSCursor"] }

[target.'cfg(target_os = "windows")'.dependencies]
libloading = "0.7"
same-file = "1"
windows-sys = { version = "0.61", features = ["Win32_System_Power", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader"] }

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
objc2-ui-kit = { version = "0.3", default-features = false, features = ["UIApplication", "UIResponder"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
libloading = "0.7"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Full debug info and incremental copies of the media backend quickly use GBs.
[profile.dev]
debug = 1
incremental = false
